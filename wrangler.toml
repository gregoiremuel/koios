name = "koios"
main = "worker.js"
compatibility_date = "2026-10-01"

# Fichiers de l'app servis tels quels ; /api/... est confié à worker.js.
[assets]
directory = "./app"
binding = "ASSETS"

# Workers AI : le Rival écrit les sujets libres.
[ai]
binding = "AI"

# Base D1 (progression, classement, brouillons, signalements).
# Sans cette liaison, l'API répond 503 {"erreur":"base absente"} sur les routes qui en ont besoin.
[[d1_databases]]
binding = "DB"
database_name = "koios"
database_id = "a8c63c1f-f40c-4204-b201-0914846bd0db"

# Génération de la file : réveil toutes les 5 minutes, toute la journée ; traiterFile ne travaille que de 0 h à 5 h 59 UTC (la nuit) ou si l'admin a
# autorisé la journée. Au plus 2 tâches par passage, 300 par jour (lib/nuit.js).
# Le secret ADMIN_KEY protège /api/admin (posé côté Cloudflare, jamais dans le dépôt).
[triggers]
crons = ["*/5 * * * *"]
